name: release
on:
  push:
    branches: [main]
  # Publishes a version whose tag and Release commit already exist on main but which is not on
  # npm, then creates its GitHub release. Runs the publish-existing job only.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, e.g. v0.2.4
        required: true
        type: string
# The workflow token only reads. Every write (the Release commit, the v* tag,
# the GitHub release and its comments) uses a token minted from the release
# GitHub App, which is the one actor allowed to push to protected main and to
# create v* tags.
permissions:
  contents: read
  id-token: write   # npm OIDC trusted publishing + provenance
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The release environment admits main only; it holds the release App key, and npm
    # trusted publishing accepts a publish only from a job in it.
    environment: release
    steps:
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0        # full history + tags for version analysis
          # The checkout's saved credentials are what `git push` uses, so they
          # must be the App's, not the workflow token's.
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1
      - run: pnpm install --frozen-lockfile
      # .releaserc.json: @semantic-release/npm only writes the version to package.json
      # (npmPublish false). In the publish step, @semantic-release/exec runs
      # scripts/release-publish.sh, which packs with pnpm, checks the tarball and publishes it
      # with provenance; @semantic-release/github then creates the GitHub release.
      - run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # The release commit is the App's work, so it is authored as the App's bot.
          GIT_AUTHOR_NAME: agenttrail-public-release[bot]
          GIT_AUTHOR_EMAIL: 338791256+agenttrail-public-release[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: agenttrail-public-release[bot]
          GIT_COMMITTER_EMAIL: 338791256+agenttrail-public-release[bot]@users.noreply.github.com

  publish-existing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The release environment admits main only; it holds the release App key, and npm
    # trusted publishing accepts a publish only from a job in it.
    environment: release
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0        # tags and origin/main for the checks
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Refuses a malformed, missing or off-main tag, a package.json version that differs from
      # the tag, and a version npm already has. Picks the dist-tag: latest only when the version
      # is higher than npm's current latest.
      - id: check
        run: bash scripts/release-precheck.sh "$TAG"
      # The release scripts are taken from main, not from the tag, so a tag made before a script
      # was added or changed is published with the current ones.
      - run: cp -R scripts "$RUNNER_TEMP/release-scripts"
      - run: git checkout --detach "refs/tags/$TAG"
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
      - run: npm install -g npm@latest   # OIDC trusted publishing needs npm >= 11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The release job's publish path, run on the tag's tree: the precheck again, pnpm pack
      # (which applies the publishConfig dist entry points), check-tarball.py, then npm publish
      # of that tarball with provenance under the dist-tag the precheck picked.
      - name: Publish
        id: publish
        env:
          VERSION: ${{ steps.check.outputs.version }}
          PACK_DIR: ${{ runner.temp }}/pack
        run: bash "$RUNNER_TEMP/release-scripts/release-publish.sh" "$VERSION"
      # The GitHub release is created as soon as the publish succeeds; the npm check below runs
      # after it, so a slow registry never holds back the release.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.check.outputs.version }}
          DIST_TAG: ${{ steps.check.outputs.dist_tag }}
        run: |
          if out=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "A GitHub release for $TAG already exists; skipping."
            exit 0
          elif ! printf '%s' "$out" | grep -q 'release not found'; then
            echo "$out" >&2
            exit 1
          fi
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "CHANGELOG.md at $TAG has no section for $VERSION" >&2
            exit 1
          fi
          latest=false
          if [ "$DIST_TAG" = latest ]; then latest=true; fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "$notes" --latest="$latest"
      # A zero exit from npm publish does not mean the version is installable; wait up to 60
      # minutes for the registry to serve it, with the entry points of the published tarball.
      # Runs whenever the publish succeeded, even if creating the GitHub release failed.
      - name: Verify the version is on npm
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        timeout-minutes: 65
        env:
          PACK_DIR: ${{ runner.temp }}/pack
        run: |
          tarball=$(ls "$PACK_DIR"/*.tgz)   # release-publish.sh leaves exactly one
          bash "$RUNNER_TEMP/release-scripts/verify-published.sh" "$tarball"
