name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint and format
        run: pnpm lint

      - name: Spell check
        run: pnpm spell

      - name: Types
        run: pnpm typecheck

      # Includes each rule's match and no-match examples and the shared no-match corpus.
      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # Packs the tarball, checks its contents, then installs it in an empty directory and imports it.
  # The release packs the same way and runs the same check-tarball.py before it publishes
  # (scripts/release-publish.sh), so a tarball that fails here could not be published either.
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Pack
        run: |
          mkdir -p /tmp/pack
          pnpm pack --pack-destination /tmp/pack

      - name: Check tarball contents
        run: |
          v=$(node -p "require('./package.json').version")
          python3 scripts/check-tarball.py /tmp/pack/*.tgz \
            --package @agenttrail/guardrails --version "$v"

      - name: Install and import the tarball
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install /tmp/pack/*.tgz >/dev/null
          node --input-type=module -e "
            import { RULES } from '@agenttrail/guardrails/guardrails';
            import { parseRule } from '@agenttrail/guardrails';
            import { RuleSchema } from '@agenttrail/guardrails/schema';
            if (!Array.isArray(RULES) || RULES.length === 0) throw new Error('RULES is empty');
            if (typeof parseRule !== 'function') throw new Error('parseRule missing');
            if (!RuleSchema) throw new Error('schema subpath did not resolve');
            console.log('  ok  imported', RULES.length, 'guardrails (ESM)');
          "
          node -e "
            const r = require('@agenttrail/guardrails/guardrails');
            if (!r.RULES || !r.RULES.length) throw new Error('CJS require gave no rules');
            console.log('  ok  imported', r.RULES.length, 'guardrails (CJS)');
          "
